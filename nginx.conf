server {
    listen 80;
    server_name localhost;

    # Diretório com os arquivos estáticos compilados
    root /usr/share/nginx/html;
    index index.html;

    # Suporte a SPA (Single Page Application) - Redireciona rotas para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Otimização de cache para arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Compactação Gzip para carregamento ultrarrápido
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";
}
